name: API drift

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-drift
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compare snapshots with live docs
        id: check
        continue-on-error: true
        run: go run ./cmd/docscheck
      - name: Print contract diff
        if: steps.check.outcome == 'failure'
        continue-on-error: true
        run: |
          go run ./cmd/docscheck -diff > drift.txt 2>&1
          status=$?
          cat drift.txt
          exit "$status"
      - name: Open or update the drift issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const label = 'api-drift';
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (err) {
              if (err.status !== 404) throw err;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: 'b60205',
                description: 'Seller API snapshot differs from the live docs',
              });
            }
            let diff = '';
            if (fs.existsSync('drift.txt')) {
              diff = fs.readFileSync('drift.txt', 'utf8');
            }
            if (diff.length > 60000) {
              diff = diff.slice(0, 60000) + '\n... truncated';
            }
            const body = [
              'Снимки в `testdata/` разошлись с живой документацией seller.ggsel.com.',
              'Workflow файлы не перезаписывает. Обновление локально: `go run ./cmd/docscheck -write`, затем типы, тесты и CHANGELOG.',
              '',
              '```',
              diff || '(diff недоступен)',
              '```',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 20,
            });
            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner,
                repo,
                title: 'Снимок Seller API разошёлся с документацией',
                body,
                labels: [label],
              });
              return;
            }
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body,
              });
            }
      - name: Close the drift issue when the snapshots match
        if: steps.check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'api-drift';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 20,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: 'Сверка снова совпала со снимками в testdata.',
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
      - name: Fail the job when the snapshots differ
        if: steps.check.outcome == 'failure'
        run: exit 1

  client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: vet
        run: go vet ./...
