name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a v0 or v1 tag
        run: |
          case "${GITHUB_REF_NAME}" in
            v0.*|v1.*) ;;
            *)
              echo "tag must be v0.x.y or v1.x.y, not ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: test
        run: go test ./...
      - name: vet
        run: go vet ./...

  publish:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
      - name: Add the version and date to the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          date=$(git log -1 --format=%cs "${GITHUB_SHA}")
          git fetch origin master
          git checkout master
          if grep -q "^## \[$version\]" CHANGELOG.md; then
            exit 0
          fi
          awk -v heading="## [$version] - $date" '
            !done && /^## \[[0-9]/ { print heading; print ""; done = 1 }
            { print }
            END { if (!done) { print ""; print heading; print "" } }
          ' CHANGELOG.md > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Changelog ${version}"
          git push origin master
